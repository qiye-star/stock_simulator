<!doctype html>
<html lang="zh-CN">
  <head>

    <script src="js/lib/html.js"></script>
    <script src="js/lib/format.js"></script>
    <script src="js/lib/clock-model.js"></script>
    <script src="js/mock/data.js"></script>
    <script src="js/lib/store.js"></script>
    <script src="js/lib/api.js"></script>
    <script src="js/lib/store.real.js"></script>
    <script src="js/lib/chart.js"></script>
    <script src="js/lib/router.js"></script>

    <script src="js/features/news/model.js"></script>
    <script src="js/features/news/store.js"></script>

    <script src="js/features/predict/model.js"></script>
    <script src="js/features/predict/mock.js"></script>
    <script src="js/features/predict/titles.js"></script>
    <script src="js/features/predict/store.js"></script>

    <script src="js/features/predict/slot-widgets.js"></script>
    <script src="js/features/predict/index.js"></script>

    <script src="js/features/challenge/mock.js"></script>
    <script src="js/features/challenge/store.js"></script>
    <script src="js/features/challenge/verify.js"></script>

    <!-- feature:pm（⑧ D 预测市场）：model → mock → store → ui → 买卖面板 → 页面与玩法分区 → index -->
    <script src="js/features/pm/model.js"></script>
    <script src="js/features/pm/mock.js"></script>
    <script src="js/features/pm/store.js"></script>
    <script src="js/features/pm/ui.js"></script>

    <script src="js/features/replay/mock.js"></script>

</html>
