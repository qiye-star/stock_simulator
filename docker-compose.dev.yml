# 开发覆盖层：源码挂载 + 热更新，不构建生产镜像。
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 后端：uv run uvicorn --reload（依赖装在命名卷 backend-venv 中，避免宿主机 .venv 冲突）
# 前端：vite dev server，http://localhost:${FRONTEND_DEV_PORT:-5173}
# 注意：开发模式下 frontend 不经过 nginx，/api 由 vite 代理到 backend（见 frontend/vite.config.js）。

services:
  migrate:
    build: !reset null
    image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm-slim
    working_dir: /app
    command: ["uv", "run", "--locked", "alembic", "upgrade", "head"]
    environment:
      UV_LINK_MODE: copy
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv

  backend:
    build: !reset null
    image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm-slim
    working_dir: /app
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - --factory
      - stocksim.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --proxy-headers
    environment:
      UV_LINK_MODE: copy
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    ports: !override
      - "${BACKEND_DEV_PORT:-18002}:8000"
    expose: !reset []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      npm_config_fund: "false"
      npm_config_audit: "false"
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    healthcheck:
      disable: true

volumes:
  backend-venv:
  frontend-node-modules:
