# 宿主机 nginx 反代示例（方案 A）：负责 HTTPS 与按域名分流，容器只提供 HTTP。
#   https://a.com/    网页版 -> 127.0.0.1:18000（compose 的 frontend）
#   https://m.a.com/  手机版 -> 127.0.0.1:18001（compose 的 mobile）
# 两个容器的 nginx 都把同源 /api（含 WebSocket）转发到同一个 backend，数据库共享。
#
# 用法：复制到 /etc/nginx/conf.d/stocksim.conf，把 a.com / m.a.com 与证书路径换成实际值，
#       nginx -t && systemctl reload nginx。
# 前置：.env 里设 COOKIE_SECURE=true 与随机 SECRET_KEY（见 deploy/README.md）。
# Cookie：后端不设 Domain，a.com 与 m.a.com 各自一份 session，登录互不影响，请勿改成 Domain=.a.com。

# WebSocket 升级：有 Upgrade 头则 upgrade，否则 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------- 80 -> 443 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name a.com m.a.com;
    return 301 https://$host$request_uri;
}

# ---------------- 网页版 a.com ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name a.com;

    ssl_certificate     /etc/letsencrypt/live/a.com/fullchain.pem;   # 占位：换成实际证书
    ssl_certificate_key /etc/letsencrypt/live/a.com/privkey.pem;     # 占位
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # 行情 WebSocket：长连接，读/写超时 1 小时（前置于 / 的更具体前缀）
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ---------------- 手机版 m.a.com ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name m.a.com;

    ssl_certificate     /etc/letsencrypt/live/m.a.com/fullchain.pem; # 占位：或使用 a.com + m.a.com 的 SAN/通配符证书
    ssl_certificate_key /etc/letsencrypt/live/m.a.com/privkey.pem;   # 占位
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
